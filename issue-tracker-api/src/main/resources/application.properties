spring.application.name=issue-tracker-api
server.port=8080

# ---------------------------------------------------------
# Database (H2 in-memory for local dev/testing).
# Swap these properties for MySQL/PostgreSQL in production.
# ---------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:issuetrackerdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------------------------------------------------------
# JWT configuration
# jwt.secret MUST be a Base64-encoded string >= 256 bits for HS256.
# Override via env var JWT_SECRET / JWT_EXPIRATION in production.
# ---------------------------------------------------------
jwt.secret=${JWT_SECRET:YmY1NmY1YzQ4NDVhZTU1MDQ0NzM3NzRlZDgwYTVjNjNlZGZlYjc3NzMwODQ4ZjllNTgwMWIzYjE0OTQ3ZjM4Yg==}
jwt.expiration=${JWT_EXPIRATION:86400000}
