# Issue Tracker API - Application Configuration

# Server
server.port=8080

# Application name
spring.application.name=issue-tracker-api

# DataSource - H2 in-memory database for development
spring.datasource.url=jdbc:h2:mem:issuetracker;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (development only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway database migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Logging
logging.level.com.company.issuetracker=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN